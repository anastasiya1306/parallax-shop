{% load static %}

<header class="top-header">
    <div class="header-inner">

        <!-- Логотип -->
        <a href="{% url 'main:home' %}" class="logo-link">
            <img
                src="{% static 'img/titan-logotip.png' %}"
                alt="Титан"
                class="logo-img"
            >
        </a>

        <!-- Навигация -->
        <nav class="header-nav">
            <a href="{% url 'main:home' %}#about">О нас</a>
            <a href="{% url 'main:home' %}#products">Продукция</a>
            <a href="#contacts">Контакты</a>
        </nav>

        <button class="menu-toggle" type="button" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <!-- Мобильное меню -->
    <nav class="mobile-nav">
        <a href="{% url 'main:home' %}#about"">О нас</a>
        <a href="{% url 'main:home' %}#products">Продукция</a>
        <a href="#contacts">Контакты</a>
    </nav>
</header>

<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');
    const mobileLinks = document.querySelectorAll('.mobile-nav a');

    menuToggle.addEventListener('click', function () {
        mobileNav.classList.toggle('active');
    });

    mobileLinks.forEach(function (link) {
        link.addEventListener('click', function () {
            mobileNav.classList.remove('active');
        });
    });
</script>
